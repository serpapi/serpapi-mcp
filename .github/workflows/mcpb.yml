name: MCP Bundle

# Validation build: proves the bundle still packs, installs and starts on every
# change. Nothing is published from here; release.yml ships a version (bundle,
# hosted deployment and registry entry) when a release tag is pushed.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mcpb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          python-version: "3.13"
          enable-cache: true

      - name: Install Node.js (MCPB CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Regenerates the engine schemas from the SerpApi Playground, validates
      # manifest.json, packs the bundle, then installs it into a temp dir and
      # starts it over stdio the way Claude Desktop does.
      - name: Build and smoke-test the bundle
        run: uv run --no-project mcpb/build.py

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: serpapi-mcp-mcpb
          path: dist/*.mcpb
          if-no-files-found: error
